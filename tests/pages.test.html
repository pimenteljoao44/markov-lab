<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Testes da trilha e do laboratório de LLM</title>
<style>
  body { background:#f8fafd; color:#1f2a44; font:14px/1.6 ui-monospace, Consolas, monospace; padding:24px; }
  .pass { color:#12a150 } .fail { color:#e5383b; font-weight:700 } h1 { font-size:16px }
  iframe { border:1px solid #c9d4e3; display:block; margin-top:16px; }
</style>
</head>
<body>
<h1>Trilha e laboratório de LLM: testes dos fluxos (as páginas rodam na janela abaixo)</h1>
<p>Os dados salvos neste navegador são guardados antes dos testes e recolocados no fim.</p>
<pre id="out"></pre>
<div id="stage"></div>
<script type="module">
import { encodeShare } from '../js/models/share.js';
import { externalRequests } from './hooks/external.js';
import { TRAIL_KEY, TRAIL_UI_KEY, MIN_EXPLAIN } from '../js/platform/progress.js';
import { LLM_KEY } from '../js/llm/state.js';
import { VEC_KEY } from '../js/vectors/state.js';
import { VEC_CHALLENGES } from '../js/vectors/challenges.js';
import { VEC_TIPS } from '../js/vectors/tips.js';
import { EOS } from '../js/llm/ngram.js';
import { CHALLENGES } from '../js/challenges/definitions.js';
import { COURSE } from '../js/learn/course.js';

const NOTEBOOK = 'llmlab:caderno';
const VEC_NOTEBOOK = 'vectorlab:caderno';
const KEYS = [TRAIL_KEY, TRAIL_UI_KEY, LLM_KEY, NOTEBOOK, VEC_KEY, VEC_NOTEBOOK, 'markovlab:v3', 'markovlab:course', 'markovlab:coach'];
const BASE = new URL('../', location.href).href;
const out = document.getElementById('out');
const backup = Object.fromEntries(KEYS.map((k) => [k, localStorage.getItem(k)]));

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function until(fn, what = 'condição', ms = 5000) {
  const end = performance.now() + ms;
  for (;;) {
    const v = fn();
    if (v) return v;
    if (performance.now() > end) throw new Error(`esperei demais por: ${what}`);
    await sleep(20);
  }
}
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
function assert(c, msg = 'falhou') { if (!c) throw new Error(msg); }
function same(a, b, label = 'valor') { assert(a === b, `${label}: veio "${a}", esperado "${b}"`); }

let frame = null;
const win = () => frame.contentWindow;
const doc = () => frame.contentDocument;
const $ = (sel) => doc().querySelector(sel);
const $$ = (sel) => [...doc().querySelectorAll(sel)];
const text = (sel) => $(sel)?.textContent.replace(/\s+/g, ' ').trim() ?? '';
const saved = (key) => JSON.parse(localStorage.getItem(key));
const ready = () => until(() => doc()?.documentElement.dataset.ready === '1', 'a página ficar pronta', 15000);

/** Abre uma página do zero, com os dados salvos pedidos. */
async function boot(page, { storage = {}, width = 1280, height = 800, hash = '' } = {}) {
  frame?.remove();
  await sleep(0);
  for (const k of KEYS) localStorage.removeItem(k);
  localStorage.setItem('markovlab:coach', JSON.stringify({ enabled: false, seen: [] }));
  for (const [k, v] of Object.entries(storage)) localStorage.setItem(k, JSON.stringify(v));
  frame = document.createElement('iframe');
  frame.src = `${BASE}${page}${hash}`;
  frame.style.width = `${width}px`;
  frame.style.height = `${height}px`;
  const loaded = new Promise((r) => frame.addEventListener('load', r, { once: true }));
  document.getElementById('stage').appendChild(frame);
  await loaded;
}

/** Recarrega como F5, sem esperar o salvamento automático. */
async function reload() {
  const loaded = new Promise((r) => frame.addEventListener('load', r, { once: true }));
  win().location.reload();
  await loaded;
  await ready();
}

function type(el, value) {
  el.value = value;
  el.dispatchEvent(new (win().Event)('input', { bubbles: true }));
}
function slide(key, value) {
  type($(`[data-set="${key}"]`), String(value));
}
const handle = (key) => $(`[data-handle="${key}"]`);
const shown = (sel) => win().getComputedStyle($(sel)).display !== 'none';
function pressKey(el, key, opts = {}) {
  el.dispatchEvent(new (win().KeyboardEvent)('keydown', { key, bubbles: true, cancelable: true, ...opts }));
}
const generated = () => $$('#gen-line .tk-chip:not(.given)').map((c) => c.textContent);
const bars = () => $$('.nt-row');
const noOverflow = () => assert(doc().documentElement.scrollWidth <= doc().documentElement.clientWidth + 1, `a página passa da largura: ${doc().documentElement.scrollWidth} em ${doc().documentElement.clientWidth}`);
function namedControls() {
  for (const el of $$('button, a[href], input, textarea, select')) {
    if (el.closest('[hidden]') || el.type === 'hidden') continue;
    const name = el.getAttribute('aria-label') || el.textContent.trim() || el.labels?.[0]?.textContent.trim() || el.getAttribute('title') || el.getAttribute('placeholder');
    assert(name, `controle sem nome: ${el.outerHTML.slice(0, 90)}`);
  }
}
async function noExternalRequests(page) {
  const external = await externalRequests(win(), BASE, page);
  same(external.length, 0, `pedidos externos (${external.join(', ')})`);
}

const LONG = 'Uma explicação escrita com as próprias palavras, comprida o bastante para contar como explicada.';
/** Tudo da fase 0 feito: os laboratórios que existem, as leituras e as três explicações. */
const PHASE0_DONE = {
  [VEC_KEY]: { completed: VEC_CHALLENGES.map((c) => c.id) },
  'markovlab:v3': { completed: CHALLENGES.map((c) => c.id) },
  'markovlab:course': { done: COURSE.map((s) => s.id) },
  [TRAIL_KEY]: {
    checks: ['khan-estatistica', '3b1b-algebra', '3b1b-calculo'],
    notes: { 'explica-processos': LONG, 'explica-vetores': LONG, 'explica-gradiente': LONG },
  },
};
const closedPhases = () => $$('.phase.closed').map((p) => p.dataset.phase).join();
/** A rolagem suave quase não anda com a janela em segundo plano: nos testes importa onde ela termina. */
function instantScroll() {
  const native = win().Element.prototype.scrollIntoView;
  win().Element.prototype.scrollIntoView = function (options) {
    native.call(this, { ...options, behavior: 'instant' });
  };
}
/** Guarda o que a página mandaria baixar, sem baixar nada. */
function captureDownloads() {
  const files = [];
  win().URL.createObjectURL = (blob) => {
    files.push(blob);
    return 'blob:teste';
  };
  win().HTMLAnchorElement.prototype.click = function () {};
  return files;
}

const TESTS = [
  // ── 0. Só o que é da página
  ['as quatro páginas trazem a política que barra conteúdo de fora', async () => {
    for (const page of ['index.html', 'markov.html', 'llm.html', 'vectors.html']) {
      const source = await (await fetch(`${BASE}${page}`)).text();
      const policy = source.match(/http-equiv="Content-Security-Policy" content="([^"]+)"/)?.[1] || '';
      assert(/default-src 'self'/.test(policy), `${page}: sem política`);
      assert(!/unsafe-eval|script-src|\*/.test(policy), `${page}: política frouxa (${policy})`);
      assert(!/<script(?![^>]*\ssrc=)[^>]*>/.test(source), `${page}: script embutido no HTML`);
      assert(!/\son[a-z]+\s*=/.test(source), `${page}: tratador de evento embutido no HTML`);
      assert(source.indexOf('Content-Security-Policy') < source.indexOf('<script'), `${page}: a política vem antes de qualquer script`);
    }
  }],
  ['script de outro site é barrado pelo navegador, sem derrubar a página', async () => {
    await boot('index.html');
    await ready();
    const blocked = new Promise((resolve) => doc().addEventListener('securitypolicyviolation', (e) => resolve(e.blockedURI), { once: true }));
    const script = doc().createElement('script');
    script.src = 'https://exemplo.invalid/espiao.js';
    doc().head.appendChild(script);
    const uri = await Promise.race([blocked, sleep(3000).then(() => 'nada foi barrado')]);
    assert(uri.includes('exemplo.invalid'), uri);
    assert(!$('#boot-error'), 'script de fora barrado não é falha da página');
  }],

  // ── 1. Trilha
  ['trilha: abre com as cinco fases, sem falar com outro site', async () => {
    await boot('index.html');
    await ready();
    same($$('.phase').length, 5, 'fases');
    assert($$('.item').length > 30, 'itens');
    same(text('.total-pct'), '0%', 'progresso');
    assert(/Laboratório de Markov/.test(text('.next-title')), text('.next-title'));
    await doc().fonts.ready;
    await noExternalRequests('index.html');
    assert(!$('#boot-error'), 'sem mensagem de erro');
    namedControls();
  }],
  ['trilha: marcar um item muda o progresso e sobrevive a recarregar', async () => {
    await boot('index.html');
    await ready();
    const box = $('[data-check="khan-estatistica"]');
    box.click();
    assert($('[data-item="khan-estatistica"]').classList.contains('done'), 'item marcado');
    assert(text('.total-pct') !== '0%', 'progresso geral');
    assert(saved(TRAIL_KEY).checks.includes('khan-estatistica'), 'salvo na hora');
    await reload();
    assert($('[data-check="khan-estatistica"]').checked, 'continua marcado');
    $('[data-check="khan-estatistica"]').click();
    same(text('.total-pct'), '0%', 'desmarcar devolve o progresso');
  }],
  ['trilha: explicação curta não conta; a completa conta e não se perde ao recarregar', async () => {
    await boot('index.html');
    await ready();
    const note = $('[data-note="explica-processos"]');
    type(note, 'Porque sim.');
    assert(!$('[data-item="explica-processos"]').classList.contains('done'), 'curta não conta');
    assert(/Mais \d+ caracteres/.test(text('[data-item="explica-processos"] [data-note-count]')), 'diz quanto falta');
    const full = 'Com 20 sorteios o acaso domina o resultado; com 2.000 a fração observada fica perto da chance real.';
    assert(full.length >= MIN_EXPLAIN, 'texto de teste');
    type(note, full);
    assert($('[data-item="explica-processos"]').classList.contains('done'), 'completa conta');
    same(doc().activeElement === note || doc().activeElement === doc().body, true, 'escrever não joga o foco para outro lugar');
    await reload(); // sem esperar o salvamento automático
    same($('[data-note="explica-processos"]').value, full, 'texto guardado');
  }],
  ['trilha: mostra o progresso que o laboratório salvou', async () => {
    await boot('index.html', { storage: { 'markovlab:v3': { completed: ['memoryless', 'run-sim'] }, 'markovlab:course': { done: ['basico'] } } });
    await ready();
    assert(/^3 de 17/.test(text('[data-item="lab-markov"] [data-lab-count]')), text('[data-item="lab-markov"] [data-lab-count]'));
    assert(/^0 de 7/.test(text('[data-item="lab-llm"] [data-lab-count]')), text('[data-item="lab-llm"] [data-lab-count]'));
    same($('[data-item="lab-markov"] [data-open]').getAttribute('href'), 'markov.html', 'link do laboratório');
    assert(/^0 de 7/.test(text('[data-item="lab-vetores"] [data-lab-count]')), text('[data-item="lab-vetores"] [data-lab-count]'));
    same($('[data-item="lab-vetores"] [data-open]').getAttribute('href'), 'vectors.html', 'link do laboratório de vetores');
    assert(!$('[data-item="lab-gradiente"] [data-open]'), 'laboratório planejado não tem botão de abrir');
  }],
  ['trilha: "Ir para lá" leva ao próximo passo', async () => {
    await boot('index.html');
    await ready();
    $('[data-goto]').click();
    assert($('[data-item="lab-markov"]').classList.contains('spot'), 'item destacado');
    same(doc().activeElement, $('[data-item="lab-markov"] [data-open]'), 'foco no botão de abrir');
  }],
  ['trilha: só a fase do próximo passo abre sozinha; a escolha de abrir e fechar fica guardada', async () => {
    await boot('index.html');
    await ready();
    same(closedPhases(), 'fase1,fase2,fase3,fase4', 'fases fechadas ao abrir');
    assert($('#body-fase1').hidden && !$('#body-fase0').hidden, 'só o conteúdo da fase aberta aparece');
    same($('[data-toggle="fase0"]').getAttribute('aria-expanded'), 'true', 'estado da fase aberta');
    same($('[data-toggle="fase1"]').getAttribute('aria-expanded'), 'false', 'estado da fase fechada');
    $('[data-toggle="fase2"]').click();
    assert(!$('#body-fase2').hidden, 'um clique abre');
    $('[data-toggle="fase0"]').click();
    assert($('#body-fase0').hidden, 'outro clique fecha');
    await reload();
    same(closedPhases(), 'fase0,fase1,fase3,fase4', 'escolhas guardadas');
    assert($$('.item').length > 30, 'os itens continuam todos na página');
  }],
  ['trilha: fase concluída recolhe e a seguinte abre', async () => {
    await boot('index.html', { storage: PHASE0_DONE });
    await ready();
    same(closedPhases(), 'fase0,fase2,fase3,fase4', 'fases fechadas');
    assert($('[data-phase="fase0"]').classList.contains('complete'), 'fase 0 completa');
    same($('.idx-row.done').dataset.phaseGo, 'fase0', 'índice marca a fase feita');
    same(text('.idx-row.done .idx-num'), '✓', 'marca que não depende de cor');
    same($('.idx-row.current').dataset.phaseGo, 'fase1', 'índice marca a fase atual');
    same($('.item.next').dataset.item, '3b1b-llm', 'próximo passo na lista');
    same($('.item.next').getAttribute('aria-current'), 'step', 'próximo passo para leitor de tela');
    assert(!$('[data-next-open]') && /Ir para lá/.test(text('[data-goto]')), 'aula não tem botão de abrir laboratório');
    $('[data-check="3b1b-llm"]').click();
    same($('.item.next').dataset.item, 'lab-llm', 'o marcador acompanha o progresso');
    same($('[data-next-open]').getAttribute('href'), 'llm.html', 'laboratório abre direto da ficha');
  }],
  ['trilha: o índice leva à fase e a abre, sem mudar a preferência', async () => {
    await boot('index.html');
    await ready();
    instantScroll();
    same($$('.idx-row').length, 5, 'fases no índice');
    $('[data-phase-go="fase3"]').click();
    assert(!$('#body-fase3').hidden, 'abre a fase');
    same(doc().activeElement, $('[data-toggle="fase3"]'), 'foco no título da fase');
    const top = $('[data-phase="fase3"]').getBoundingClientRect().top;
    assert(top >= 0 && top < win().innerHeight / 2, `a fase vem para o alto da tela (${Math.round(top)})`);
    await reload();
    assert($('#body-fase3').hidden, 'ir até uma fase não vira preferência');
  }],
  ['trilha: "Ver na trilha" abre a fase que estava fechada', async () => {
    await boot('index.html');
    await ready();
    instantScroll();
    $('[data-toggle="fase0"]').click();
    assert($('#body-fase0').hidden, 'fase fechada');
    $('[data-goto]').click();
    assert(!$('#body-fase0').hidden, 'a fase abre');
    assert($('[data-item="lab-markov"]').classList.contains('spot'), 'item destacado');
  }],
  ['trilha: abrir e recolher todas as fases', async () => {
    await boot('index.html');
    await ready();
    same(text('[data-all]'), 'Abrir todas as fases', 'botão');
    $('[data-all]').click();
    same(closedPhases(), '', 'todas abertas');
    same(text('[data-all]'), 'Recolher todas as fases', 'botão troca de nome');
    $('[data-all]').click();
    same(closedPhases(), 'fase0,fase1,fase2,fase3,fase4', 'todas fechadas');
    noOverflow();
    namedControls();
  }],
  ['trilha: concluir uma fase avisa na hora', async () => {
    await boot('index.html');
    await ready();
    instantScroll();
    $('[data-phase-go="fase4"]').click();
    $('[data-check="entrega-treinamento"]').click();
    $('[data-check="entrega-apoio"]').click();
    assert(!$$('.toast').length, 'ainda falta a explicação');
    type($('[data-note="explica-capacitacao"]'), LONG);
    const toast = await until(() => $$('.toast').find((t) => /Fase 4 concluída/.test(t.textContent)), 'o aviso');
    assert(/Plano de capacitação/.test(toast.textContent), 'o aviso lembra o combinado da fase');
    same(text('[data-phase-go="fase4"] .idx-num'), '✓', 'índice');
    assert(!$('#body-fase4').hidden, 'a fase não fecha debaixo de quem acabou de concluí-la');
    type($('[data-note="explica-capacitacao"]'), `${LONG} E mais um pouco.`);
    same($$('.toast').filter((t) => /Fase 4 concluída/.test(t.textContent)).length, 1, 'avisa uma vez só');
  }],
  ['trilha: as explicações saem em um documento só', async () => {
    await boot('index.html');
    await ready();
    const files = captureDownloads();
    $('[data-notes]').click();
    same(files.length, 0, 'sem nada escrito não há arquivo');
    await until(() => $$('.toast').find((t) => /Ainda não há explicações/.test(t.textContent)), 'o aviso de que falta escrever');
    type($('[data-note="explica-processos"]'), LONG);
    $('[data-notes]').click();
    same(files.length, 1, 'um arquivo');
    const written = await files[0].text();
    assert(written.startsWith('# Caderno de IA aplicada: minhas explicações'), written.slice(0, 50));
    assert(written.includes('## Fase 0') && written.includes(LONG), 'fase e texto');
  }],
  ['trilha: lembra de guardar a cópia quando já há trabalho e ela nunca foi feita', async () => {
    await boot('index.html');
    await ready();
    same(text('.backup-note'), 'Nada para guardar ainda.', 'sem progresso');
    assert(!$('.backup-note.warn'), 'sem alarme à toa');
    $('[data-check="khan-estatistica"]').click();
    assert($('.backup-note.warn'), 'com progresso e sem cópia');
    assert(/ainda não guardou uma cópia/.test(text('.backup-note')), text('.backup-note'));
    const files = captureDownloads();
    $('[data-export]').click();
    same(files.length, 1, 'baixou a cópia');
    same(text('.backup-note'), 'Última cópia guardada hoje.', 'depois de guardar');
    assert(!$('.backup-note.warn'), 'o alarme sai');
    await reload();
    same(text('.backup-note'), 'Última cópia guardada hoje.', 'a data sobrevive a recarregar');
  }],
  ['trilha: cópia antiga com trabalho novo volta a lembrar', async () => {
    const day = 86400000;
    await boot('index.html', { storage: { [TRAIL_UI_KEY]: { backupAt: Date.now() - 20 * day }, [TRAIL_KEY]: { checks: ['khan-estatistica'], notes: {} } } });
    await ready();
    assert($('.backup-note.warn') && /há 20 dias/.test(text('.backup-note')), text('.backup-note'));
    await boot('index.html', { storage: { [TRAIL_UI_KEY]: { backupAt: Date.now() - 3 * day }, [TRAIL_KEY]: { checks: ['khan-estatistica'], notes: {} } } });
    await ready();
    assert(!$('.backup-note.warn') && /há 3 dias/.test(text('.backup-note')), 'cópia recente não incomoda');
    await boot('index.html', { storage: { [TRAIL_UI_KEY]: { backupAt: Date.now() - day, open: 'quebrado' }, [TRAIL_KEY]: {} } });
    await ready();
    assert(/ontem/.test(text('.backup-note')), 'preferência corrompida não derruba a página');
  }],
  ['trilha: avisa uma vez quando o navegador não deixa guardar', async () => {
    await boot('index.html');
    await ready();
    win().Storage.prototype.setItem = () => {
      throw new Error('cheio');
    };
    $('[data-check="khan-estatistica"]').click();
    const toast = await until(() => $$('.toast').find((t) => /Não consegui guardar/.test(t.textContent)), 'o aviso');
    assert(/Guarde uma cópia/.test(toast.textContent), toast.textContent);
    $('[data-check="3b1b-algebra"]').click();
    same($$('.toast').filter((t) => /Não consegui guardar/.test(t.textContent)).length, 1, 'avisa uma vez só');
    assert($('[data-item="3b1b-algebra"]').classList.contains('done'), 'a página continua funcionando sem guardar');
  }],
  ['atalhos: o "?" abre a lista nas quatro páginas, e dentro de um campo é só um caractere', async () => {
    const press = (key, target = doc().body, opts = {}) => target.dispatchEvent(new (win().KeyboardEvent)('keydown', { key, bubbles: true, cancelable: true, ...opts }));
    for (const [page, extra] of [['index.html', 'Trilha'], ['markov.html', 'Desfaz'], ['llm.html', 'Sorteia'], ['vectors.html', 'Setas do plano']]) {
      await boot(page, { storage: { 'markovlab:v3': { level: 3 } } });
      await ready();
      assert(!$('dialog.shortcuts[open]'), `${page}: nada aberto de início`);
      press('?');
      const dlg = await until(() => $('dialog.shortcuts[open]'), `${page}: a lista abrir`);
      assert(dlg.querySelectorAll('kbd').length >= 6, `${page}: teclas desenhadas`);
      assert(dlg.textContent.includes(extra), `${page}: traz os atalhos da própria página`);
      assert(dlg.querySelector('h2').id === 'shortcuts-title' && dlg.getAttribute('aria-labelledby') === 'shortcuts-title', `${page}: nome para leitor de tela`);
      dlg.querySelector('[data-close]').click();
      assert(!dlg.open, `${page}: fecha pelo botão`);
      $('#btn-shortcuts').click();
      assert($('dialog.shortcuts').open, `${page}: o botão do topo também abre`);
      $('dialog.shortcuts').close();
      press('?', doc().body, { ctrlKey: true });
      assert(!$('dialog.shortcuts').open, `${page}: com Ctrl não abre`);
    }
    await boot('index.html');
    await ready();
    $('[data-toggle="fase0"]').click();
    $('[data-toggle="fase0"]').click();
    const note = $('[data-note="explica-processos"]');
    press('?', note);
    assert(!$('dialog.shortcuts[open]'), 'em campo de texto não abre');
  }],
  ['trilha: link de modelo antigo segue para o Laboratório de Markov', async () => {
    const chain = { meta: { title: 'Link antigo', unit: 'cliente', step: 'mês' }, states: [{ label: 'Ativo' }, { label: 'Saiu' }], matrix: [[0.9, 0.1], [0, 1]] };
    await boot('index.html', { hash: encodeShare(chain) });
    await until(() => win().location.pathname.endsWith('/markov.html') && $('#model-title')?.textContent === 'Link antigo', 'o modelo abrir no Laboratório de Markov', 15000);
  }],
  ['trilha: cabe na tela de um celular', async () => {
    await boot('index.html', { width: 360, height: 700 });
    await ready();
    noOverflow();
    const box = $('[data-check="khan-estatistica"]').getBoundingClientRect();
    assert(box.width >= 24 && box.height >= 24, `alvo de toque de ${box.width}×${box.height}`);
  }],
  ['Laboratório de Markov: tem o caminho de volta para a trilha', async () => {
    await boot('markov.html', { storage: { 'markovlab:v3': { level: 3 } } });
    await until(() => $('#model-title')?.textContent, 'o laboratório abrir', 15000);
    same($('.top-actions a.text-btn').getAttribute('href'), 'index.html');

    same(text('#nb-count'), `0/${Object.keys(VEC_TIPS).length}`, 'contador');
    $('#panel-measures [data-tip="cosseno"]').click();
    const dlg = await until(() => $('dialog.notebook[open]'), 'o caderno abrir');
    assert(dlg.querySelector('details[data-id="cosseno"]').open, 'conceito aberto');
    await until(() => /0,60/.test(dlg.querySelector('details[data-id="cosseno"] .nb-body').textContent), 'o texto usar os números que estão na tela');
    same(text('#nb-count'), `1/${Object.keys(VEC_TIPS).length}`, 'contador depois de ler');
    assert(saved(VEC_NOTEBOOK).seen.includes('cosseno'), 'salvo');
    dlg.querySelector('[data-close]').click();
    assert(!$('dialog.notebook[open]'), 'fecha');
  }],
  ['Vetores: cabe na tela de um celular nos dois modos', async () => {
    await boot('vectors.html', { width: 360, height: 700 });
    await ready();
    noOverflow();
    const plane = $('#vec-plane svg').getBoundingClientRect();
    assert(plane.width >= 285 && plane.width <= 360, `largura do plano: ${plane.width}`);
    $('[data-mode="search"]').click();
    noOverflow();
    namedControls();
  }],
  ['Vetores: módulo que não carrega mostra uma mensagem', async () => {
    frame?.remove();
    const html = await (await fetch(`${BASE}vectors.html`)).text();
    frame = document.createElement('iframe');
    frame.srcdoc = html.replace('<head>', `<head><base href="${BASE}">`).replace('src="js/vectors/main.js"', 'src="js/vectors/nao-existe.js"');
    frame.style.width = '1280px';
    frame.style.height = '800px';
    const loaded = new Promise((r) => frame.addEventListener('load', r, { once: true }));
    document.getElementById('stage').appendChild(frame);
    await loaded;
    const box = await until(() => $('#boot-error'), 'a mensagem');
    same(box.getAttribute('role'), 'alert', 'papel');
  }],
];

let passed = 0;
let failed = 0;
const failures = [];
try {
  for (const [name, fn] of TESTS) {
    try {
      await fn();
      passed++;
      out.innerHTML += `<span class="pass">✓ ${esc(name)}</span>\n`;
    } catch (e) {
      failed++;
      failures.push(`${name}: ${e.message}`);
      out.innerHTML += `<span class="fail">✗ ${esc(name)}: ${esc(e.message)}</span>\n`;
    }
  }
} finally {
  frame?.remove();
  await sleep(50);
  for (const [k, v] of Object.entries(backup)) {
    if (v === null) localStorage.removeItem(k);
    else localStorage.setItem(k, v);
  }
}
out.innerHTML += `\n<b class="${failed ? 'fail' : 'pass'}">${passed} passaram, ${failed} falharam</b>`;
document.title = failed ? `FALHOU (${failed})` : `OK (${passed})`;
if (new URLSearchParams(location.search).has('report')) {
  fetch('/__report', { method: 'POST', body: JSON.stringify({ passed, failed, failures }) });
}
</script>
</body>
</html>
